<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User | CRUD-APP</title>
    <link rel="stylesheet" href="../index.css">
    <script src="../script/api.js"></script>
    <script src="../script/EditUser.js" defer></script>
</head>
<body>
    <!-- NAVBAR -->
    <header class="navbar">
        <a href="../index.html" class="logo-link">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </div>
            <span class="logo-text">CRUD-APP</span>
        </a>

        <nav class="navlinks">
            <a href="../index.html" class="nav-item">Home</a>
            <a href="./AllUsers.html" class="nav-item">All Users</a>
            <a href="./CreateUser.html" class="nav-item nav-cta-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Create User
            </a>
        </nav>
    </header>

    <!-- MAIN SECTION -->
    <main class="main-container">
        <div class="form-card-container">
            <div class="form-card">
                <div class="form-header">
                    <div class="form-header-icon" style="background: var(--warning-light); color: var(--warning);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </div>
                    <h1 class="form-title">Edit User Profile</h1>
                    <p class="form-desc" id="form-desc-text">Updating account credentials</p>
                </div>

                <form id="edit-form" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="fullname">Full Name</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input
                                type="text"
                                name="fullname"
                                id="fullname"
                                class="form-input"
                                placeholder="Loading..."
                                required
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                <polyline points="22,6 12,13 2,6"/>
                            </svg>
                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-input"
                                placeholder="Loading..."
                                required
                            />
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-input"
                                placeholder="••••••••"
                                minlength="6"
                                required
                            />
                            <button type="button" class="input-action-btn" id="toggle-pwd-btn" title="Toggle password visibility">
                                <svg id="toggle-pwd-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <p class="form-helper">Must be at least 6 characters long</p>
                    </div>

                    <div class="form-actions">
                        <a href="./AllUsers.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary" id="submit-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                <polyline points="17 21 17 13 7 13 7 21"/>
                                <polyline points="7 3 7 8 15 8"/>
                            </svg>
                            <span id="btn-text">Save Changes</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>&copy; 2026 CRUD-APP. Built with Modern HTML, CSS & Vanilla JavaScript.</p>
    </footer>
</body>
</html>
