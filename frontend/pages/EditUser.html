<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit User | CRUD-APP</title>
    <link rel="stylesheet" href="../index.css" />
    <script src="../script/EditUser.js" defer></script>
  </head>
  <body>
    <header class="navbar">
      <figure class="logo">CRUD-APP</figure>

      <nav class="navlinks">
        <a href="../index.html">Home</a>
        <a href="./CreateUser.html">Create User</a>
        <a href="./AllUsers.html">All Users</a>
      </nav>
    </header>

    <!-- MAIN SECTION -->
    <main class="main-container">
      <div class="form-container">
        <h1>Edit User</h1>
        <p class="form-subtitle">Update user credentials and save changes</p>

        <form class="form" id="edit-form">
          <div class="form-group">
            <label for="fullname">Full Name</label>
            <input
              type="text"
              name="fullname"
              id="fullname"
              placeholder="e.g. John Doe"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="john@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              placeholder="••••••••"
              minlength="6"
              required
            />
          </div>

          <button type="submit" class="submit-btn update-btn">Update User</button>
        </form>
      </div>
    </main>
  </body>
</html>
